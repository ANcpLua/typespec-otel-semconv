name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install npm deps
        run: npm ci

      - name: Bootstrap Weaver
        run: bash scripts/bootstrap-weaver.sh

      - name: Generate keys
        run: bash scripts/run-weaver.sh

      - name: Verify clean (regen + diff + untracked check)
        run: npm run verify-clean

      - name: Lint smoke (tsp compile)
        run: npm run lint:smoke

      - name: Vitest
        run: npm run test

      - name: Staging-dir guard regression test
        run: bash test/staging-dir-guard.test.sh

      - name: Nuke build (compile)
        run: dotnet build build/_build.csproj -c Release

      - name: Nuke VerifyOtelKeysReproducible
        run: ./build.sh VerifyOtelKeysReproducible
